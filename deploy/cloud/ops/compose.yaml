# Markarian Cloud OS: single-host private operations pilot. No host port publishing.
name: markarian-ops
services:
  queue:
    image: valkey/valkey:8.1.10-alpine
    restart: unless-stopped
    command: ["valkey-server","--aclfile","/run/secrets/valkey_acl","--appendonly","yes","--dir","/data","--protected-mode","yes"]
    networks: [private]
    expose: ["6379"]
    volumes: ["queue_data:/data"]
    secrets: [valkey_acl]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus","--storage.tsdb.retention.time=7d","--web.listen-address=0.0.0.0:9090"]
    networks: [private]
    expose: ["9090"]
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus_data:/prometheus"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    networks: [private]
    expose: ["3000"]
    environment:
      GF_SECURITY_ADMIN_USER: markarian_admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - "grafana_data:/var/lib/grafana"
      - "./grafana-datasources.yml:/etc/grafana/provisioning/datasources/markarian.yml:ro"
    secrets: [grafana_admin_password]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [prometheus]
networks:
  private:
    internal: true
volumes:
  queue_data:
  prometheus_data:
  grafana_data:
secrets:
  valkey_acl:
    file: ./secrets/valkey.acl
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
