name: Motion Cinema 3D Master (proof)
on:
  pull_request:
    branches: [main]
    paths:
      - "lib/motion/cinema/**"
      - "app/motion/cinema/**"
      - "scripts/motion/render-promptence-cinema.mjs"
      - ".github/workflows/motion-cinema-render.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-1080p:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      EXECUTION_ENABLED: "false"
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install product dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser renderer
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Verify authored film and source boundaries
        run: npm run motion:test-cinema
      - name: Build actual Next.js Studio
        run: npm run build
      - name: Start local Studio
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/motion-cinema-server.log 2>&1 &
          echo $! > /tmp/motion-cinema-server.pid
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:3000/motion/cinema?export=1' >/dev/null; then
              echo "3D Director route responds"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/motion-cinema-server.log
          exit 1
      - name: Render authentic Three.js 10s concept
        run: |
          mkdir -p out
          npm run motion:cinema -- out/PROMPTENCE_WEBGL_PROOF_10S.mp4 --concept --fps 24
      - name: Verify real H264 frames
        run: |
          npm run motion:verify -- out/PROMPTENCE_WEBGL_PROOF_10S.mp4 --max-duration 11
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate -of json out/PROMPTENCE_WEBGL_PROOF_10S.mp4
      - name: Upload proven MP4 and inspected QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: promptence-webgl-real-master-10s
          path: |
            out/PROMPTENCE_WEBGL_PROOF_10S.mp4
            out/PROMPTENCE_WEBGL_PROOF_10S.qa.json
          retention-days: 7
          if-no-files-found: error
      - name: Capture failure diagnostics
        if: failure()
        run: |
          echo "This is not a validated MP4 build. Check GPU/Chrome/FFmpeg failures."
          tail -100 /tmp/motion-cinema-server.log 2>/dev/null || true
