name: Margaryan Distribution CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Motion Studio outcome-first film modes and safe first-run creative workspace
        run: npm run motion:test-start
      - name: Motion production focus view, shortcuts and local human review markers
        run: npm run motion:test-focus-notes
      - name: Motion production release readiness / verified original sources and voice timelines
        run: npm run motion:test-release
      - name: Motion Workspace V2 / central canvas, 7 edit workspaces and mobile production navigation
        run: npm run motion:test-editor-workspace
      - name: Motion Film Commissions / secure public brief and honest conversion funnel
        run: npm run motion:test-commission
      - name: Motion Feature Film / 120s and multi-chapter H264 master dry-run
        run: npm run motion:test-sequence
      - name: Motion Browser Feature / 192s local Canvas workprint source boundary
        run: npm run motion:test-film-browser
      - name: Motion Local Film Sound / explicit approved human voice and licensed music
        run: npm run motion:test-film-audio
      - name: Motion Precision Cut / chronological original video splits and non-destructive shot editing
        run: npm run motion:test-precision
      - name: Motion Advanced Editor / independent owner-approved picture in picture
        run: npm run motion:test-overlays
      - name: Motion private portable production bundle / ZIP integrity, ownership and source remapping
        run: npm run motion:test-bundle
      - name: Motion commercial film chrome and genuine local microphone booth contract
        run: npm run motion:test-voice-booth
      - name: Motion real media camera framing and synchronized voice/recorder clock
        run: npm run motion:test-source-camera
      - name: Motion Public Chat Cut / safe campaign schema and 36s timeline
        run: npm run motion:test-chat-channel
      - name: Motion local source video / frame-timing and no-freeze preflight
        run: npm run motion:test-real-source
      - name: Motion Chat Operator / create, patch and visual-asset safety
        run: npm run motion:test-chat
      - name: Motion editorial story / RU EN HY / cinematic transitions
        run: npm run motion:test-editorial
      - name: Motion Production Desk schema and cue contract
        run: npm run motion:test-production
      - name: Motion multitrack voice/music FFmpeg edit contract
        run: npm run motion:test-audio
      - name: Motion soundtrack contract (no API or FFmpeg dependency)
        run: npm run motion:test-score
      - name: Motion reference codec and evidence contract
        run: npm run motion:test-reference
      - name: Cloud normalization, privacy and operator-auth contract tests
        run: node --experimental-strip-types scripts/cloud/test-contract.mjs
      - name: Verify safe Data Foundation source preparation
        run: node --test scripts/cloud/prepare-supabase.test.mjs
      - name: Test cross-provider Cloud inventory isolation
        run: node --experimental-strip-types --test scripts/cloud/test-providers.mjs
      - name: Cloud API operator defense-in-depth tests
        run: node --experimental-strip-types --test scripts/cloud/test-operator-auth.mjs
      - name: Test owned private operations stack
        run: node --test scripts/cloud/test-ops.mjs
      - name: Test self-owned platform readiness truthfulness
        run: node --experimental-strip-types --test scripts/cloud/test-owned.mjs
      - name: Verify private Prometheus telemetry and auth
        run: node --experimental-strip-types --test scripts/cloud/test-telemetry.mjs
      - name: Test encrypted Postgres backup and recovery safeguards
        run: node --test scripts/cloud/recovery.test.mjs
      - name: Test isolated disposable PostgreSQL Restore Lab safety
        run: node --test scripts/cloud/restore-lab.test.mjs
      - name: Test safe deployment review plans
        run: node --experimental-strip-types --test scripts/cloud/test-deploy-plan.mjs
      - name: Capacity planner arithmetic and safety tests
        run: node --experimental-strip-types --test scripts/cloud/test-capacity.mjs
      - name: Enforce VPS monthly budget and unknown-cost safety rules (offline)
        run: node --test scripts/cloud/budget-gate.test.mjs
      - name: Safe owned staging importer tests
        run: node --test scripts/cloud/deploy-stage.test.mjs
      - name: Verify first owned staging node and identified disposable pilot (offline)
        run: node --test scripts/cloud/first-node.test.mjs
      - name: Validate first VPS host readiness without deployment (offline)
        run: node --test scripts/cloud/vps-preflight.test.mjs
      - name: Verify private PostgreSQL durability pilot source and secrets (offline)
        run: node --test scripts/cloud/prepare-db-pilot.test.mjs
      - name: Audit VETOGRAM and Promptence Vercel portability contracts offline
        run: node --test scripts/cloud/app-portability.test.mjs
      - name: Verify multi-node placement and independent data pools (offline)
        run: node --test scripts/cloud/fleet-plan.test.mjs
      - name: Verify protected Coolify fleet inventory reconciliation (offline)
        run: node --test scripts/cloud/fleet-live.test.mjs
      - name: Verify SHA-bound Coolify staging-only rollout protocol (offline)
        run: node --test scripts/cloud/rollout.test.mjs
      - name: Validate isolated private HAProxy edge and origin health tests
        run: node --test scripts/cloud/edge-render.test.mjs scripts/cloud/edge-probe.test.mjs
      - name: Verify per-backend source identity and staging readiness (offline)
        run: node --test scripts/cloud/edge-release.test.mjs
      - name: Validate owner-run local release gate (offline)
        run: node --test scripts/cloud/local-ci.test.mjs
      - name: Test infrastructure health and ClickHouse connector
        run: node --experimental-strip-types --test scripts/cloud/test-health-signals.mjs
      - name: Mission Control V3 navigation and auth contracts
        run: node --test scripts/cloud/test-mission-control-v3.mjs
      - name: Domain connection plan validation
        run: node --experimental-strip-types --test scripts/cloud/test-domain-plan.mjs
      - name: Portfolio Guardian GitHub read-only discovery and incident tests
        run: node --test scripts/cloud/portfolio-guardian.test.mjs
      - name: Verify stacked Cloud pull request graph and CI provenance (offline)
        run: node --test scripts/cloud/cloud-stack-readiness.test.mjs
      - name: Classify incomplete GitHub Actions runs without treating runner errors as source failures
        run: node --test scripts/cloud/ci-run-gate.test.mjs
      - name: Validate isolated Cloud stack CI workflow contracts
        run: node --test scripts/cloud/test-cloud-stack-workflow.mjs
      - name: Release evidence GitHub SHA, selected CI and staging marker tests (offline)
        run: node --test scripts/cloud/release-evidence.test.mjs
      - name: Verify Cloud staging release marker isolation
        run: node --experimental-strip-types --test scripts/cloud/test-release-marker.mjs
      - name: Review Project Engine release gates for all nine products (no deployment)
        run: node --test scripts/cloud/release-guardian.test.mjs
      - name: Decision Command read-only worker evidence regression tests
        run: node --test scripts/cloud/decision-specialist.test.mjs
      - name: Unified Agent Supervisor offline federation tests
        run: node --test scripts/cloud/agent-supervisor.test.mjs
      - name: Agent Supervisor status privacy, API and freshness tests
        run: node --experimental-strip-types --test scripts/cloud/test-agent-supervisor-status.mjs
      - name: Read-only Sentinel agent regression tests
        run: node --experimental-strip-types --test scripts/cloud/test-sentinel.mjs
      - name: Sentinel status API freshness and auth tests
        run: node --experimental-strip-types --test scripts/cloud/test-sentinel-status.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: End-to-end task smoke test
        env:
          EXECUTION_ENABLED: "false"
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/margaryan-distribution.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              npm run smoke
              exit $?
            fi
            sleep 1
          done
          cat /tmp/margaryan-distribution.log
          exit 1

  voice-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: voice-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install voice dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check gateway
        run: node --check index.mjs
