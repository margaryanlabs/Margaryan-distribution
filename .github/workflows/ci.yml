name: Margaryan Distribution CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: End-to-end task smoke test
        env:
          EXECUTION_ENABLED: "false"
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/margaryan-distribution.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              npm run smoke
              exit $?
            fi
            sleep 1
          done
          cat /tmp/margaryan-distribution.log
          exit 1

  voice-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: voice-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install voice dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check gateway
        run: node --check index.mjs
