<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d13">
  <meta name="description" content="Margaryan Atlas — private project command center and idea journal.">
  <title>ATLAS — Project Command</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="editor" aria-labelledby="dialog-title">
    <form id="editor-form" method="dialog">
      <div class="dialog-head"><h2 id="dialog-title">Новая запись</h2><button type="button" class="icon-btn" id="close-dialog" aria-label="Закрыть">×</button></div>
      <div id="editor-fields"></div>
      <div class="dialog-actions"><button type="button" class="btn ghost" id="cancel-dialog">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div>
    </form>
  </dialog>
  <input type="file" id="import-json" accept=".json,application/json" hidden>
  <script src="./seed.js"></script>
  <script src="./atlas-engine.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
